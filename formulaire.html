<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solos — Demande de devis gratuit</title>
<meta name="description" content="Demandez votre devis gratuit Solos : fiche Google, site web, reels, intégration IA. Réponse par email en quelques heures.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#05070F;min-height:100vh;color:#F0EBDF;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 560px at 50% 115%,rgba(201,151,43,.30),transparent 60%),radial-gradient(640px 480px at 50% -10%,rgba(233,180,76,.18),transparent 60%),#05070F}
body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 70%);pointer-events:none}
svg.sprite{position:absolute;width:0;height:0;overflow:hidden}
.lg{width:46px;height:46px;filter:drop-shadow(0 0 16px rgba(233,180,76,.4))}
.logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.logo-t{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;letter-spacing:9px;background:linear-gradient(92deg,#E9B44C,#F0C75E 55%,#C9972B);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{width:100%;max-width:600px;background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:44px 40px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(233,180,76,.7),rgba(233,180,76,.7),transparent)}
.sub{text-align:center;font-size:17.5px;color:#9C9383;margin-bottom:8px}
.sub b{color:#F0EBDF}
label{display:block;font-size:14.5px;font-weight:700;color:#CCC3B2;margin:18px 0 7px}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:13px 16px;font-size:15.5px;color:#F5F0E6;font-family:'Tajawal',sans-serif;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#E9B44C;box-shadow:0 0 0 3px rgba(233,180,76,.12)}
select option{background:#0E0B06;color:#F0EBDF}
textarea{resize:vertical;min-height:100px}
.btn{width:100%;margin-top:26px;background:linear-gradient(92deg,#E9B44C,#F0C75E);border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:700;color:#120D04;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:.15s;box-shadow:0 8px 30px rgba(201,151,43,.35)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.ok{display:none;text-align:center;margin-top:22px;color:#E9B44C;font-weight:700;font-size:16.5px}
.foot{text-align:center;margin-top:26px;font-size:14px;color:#6E6657}
.demos{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.demos a{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);color:#9C9383;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;transition:.15s;text-decoration:none}
.demos a:hover{border-color:#E9B44C;color:#E9B44C}
.hint{font-size:13px;color:#6E6657;margin-top:6px}
</style>
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lgCloud" x1="10" y1="42" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A2C10"/><stop offset="1" stop-color="#0E0B06"/>
    </linearGradient>
    <radialGradient id="lgCore" cx="50%" cy="50%" r="50%">
      <stop stop-color="#FBE9B0"/><stop offset=".45" stop-color="#E9B44C"/><stop offset="1" stop-color="#8A5A00"/>
    </radialGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <path d="M15 44.5a9 9 0 0 1 2.2-17.6 12.2 12.2 0 0 1 23.4-.3A10.2 10.2 0 0 1 50.5 37a8.2 8.2 0 0 1-2.3 16H16.8a6.2 6.2 0 0 1-1.8-8.5Z" fill="url(#lgCloud)" stroke="rgba(255,255,255,.25)" stroke-width="1.1"/>
      <path d="M32 27.5v3.5" stroke="#E9B44C" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
      <path d="M27.5 29l-3.2 3.2" stroke="#F0C75E" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
      <path d="M36.5 29l3.2 3.2" stroke="#F0C75E" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
      <circle cx="32" cy="21" r="9.5" fill="#E9B44C" opacity=".16"/>
      <circle cx="32" cy="21" r="6" fill="#E9B44C" opacity=".32"/>
      <circle cx="32" cy="21" r="3.8" fill="url(#lgCore)"/>
      <circle cx="19" cy="11.5" r="1.5" fill="#F0C75E" opacity=".9"/>
      <circle cx="43" cy="8.5" r="1.9" fill="#E9B44C" opacity=".85"/>
      <circle cx="51" cy="17.5" r="1.15" fill="#C9972B" opacity=".9"/>
      <circle cx="14" cy="19.5" r="1.15" fill="#F0C75E" opacity=".7"/>
      <circle cx="47.5" cy="24" r="1" fill="#F0C75E" opacity=".6"/>
    </symbol>
  </defs>
</svg>

<div class="card">
  <div class="logo-row">
    <svg class="lg"><use href="#logo"/></svg>
    <span class="logo-t">SOLOS</span>
  </div>
  <div class="sub"><b>Devis gratuit</b> — réponse par email en quelques heures.<br>Audit de votre fiche Google offert.</div>

  <form id="f">
    <label>Nom complet *</label>
    <input id="name" required placeholder="Votre nom">
    <label>Nom du commerce / entreprise</label>
    <input id="biz" placeholder="Nom de votre commerce">
    <label>Téléphone</label>
    <input id="phone" placeholder="+216 ...">
    <label>Email (on vous répond sur cette adresse) *</label>
    <input id="email" type="email" required placeholder="vous@exemple.com">
    <label>Service souhaité *</label>
    <select id="svc" required>
      <option value="">— Choisir un service —</option>
      <option>Site web (vitrine / pro / boutique en ligne)</option>
      <option>Fiche Google</option>
      <option>Reels sur commande</option>
      <option>Intégration IA</option>
      <option>Plusieurs services</option>
    </select>
    <label>Votre besoin</label>
    <textarea id="msg" placeholder="Décrivez votre besoin..."></textarea>
    <button class="btn" type="submit">Envoyer ma demande</button>
  </form>
  <div class="ok" id="ok">Demande envoyée ! On vous répond par email très vite.</div>
  <div class="demos">
    <a href="https://solos-tn.github.io/solos/demos/vitrine-commerce/" target="_blank">Exemple : commerce</a>
    <a href="https://solos-tn.github.io/solos/demos/pro-sante/" target="_blank">Exemple : santé</a>
    <a href="https://solos-tn.github.io/solos/demos/boutique-ecommerce/" target="_blank">Exemple : boutique</a>
  </div>
  <div class="foot">Solos · Intelligence artificielle · solos-tn.github.io/solos</div>
</div>

<script>
var WEBHOOK = "https://races-montana-que-gsm.trycloudflare.com/lead";
var CONTACT_EMAIL = "solos@agentmail.to";
// Pré-remplissage depuis le catalogue (?modele=vitrine|pro|boutique)
(function(){
  var m = new URLSearchParams(location.search).get('modele');
  if(!m) return;
  var map = {
    'vitrine':  ['Site web (vitrine / pro / boutique en ligne)', 'Modèle souhaité : Vitrine commerce — 700 DT (offre de lancement, au lieu de 1 200 DT). '],
    'pro':      ['Site web (vitrine / pro / boutique en ligne)', 'Modèle souhaité : Site Pro / Santé — 1 400 DT (offre de lancement, au lieu de 2 500 DT). '],
    'boutique': ['Site web (vitrine / pro / boutique en ligne)', 'Modèle souhaité : Boutique en ligne — 2 500 DT (offre de lancement, au lieu de 4 000 DT). ']
  };
  var v = map[m]; if(!v) return;
  var sel = document.getElementById('svc');
  for(var i=0;i<sel.options.length;i++){
    if(sel.options[i].text === v[0]){ sel.selectedIndex = i; break; }
  }
  var msg = document.getElementById('msg');
  msg.value = v[1] + msg.value;
})();
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var d = {
    name: document.getElementById("name").value,
    biz: document.getElementById("biz").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    service: document.getElementById("svc").value,
    message: document.getElementById("msg").value
  };
  if (WEBHOOK) {
    fetch(WEBHOOK, {method:"POST", headers:{"Content-Type":"application/json", "x-solos-secret":"MQKa_x81g8wsEGKfbHiE9g"}, body: JSON.stringify(d)})
      .then(function(){ showOk(); }).catch(function(){ mailFallback(d); });
  } else {
    mailFallback(d);
  }
});
function mailFallback(d){
  var subject = encodeURIComponent("[Solos] Demande: " + d.service + " — " + d.name);
  var body = encodeURIComponent(
    "Nom: " + d.name + "\n" +
    "Commerce: " + d.biz + "\n" +
    "Téléphone: " + d.phone + "\n" +
    "Email: " + d.email + "\n" +
    "Service: " + d.service + "\n" +
    "Besoin: " + d.message);
  window.open("mailto:" + CONTACT_EMAIL + "?subject=" + subject + "&body=" + body, "_self");
  showOk();
}
function showOk(){
  document.getElementById("ok").style.display = "block";
  document.getElementById("f").reset();
}
</script>
</body>
</html>
